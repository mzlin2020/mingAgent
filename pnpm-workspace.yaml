packages:
  - 'packages/*'
  - 'apps/*'

# 只允许这些包跑安装脚本（pnpm 默认全部禁止）。白名单越短越好——
# 安装脚本是供应链攻击的主要入口，esbuild 是 size-limit 的下载型二进制，必须放行。
allowBuilds:
  esbuild: true
  # better-sqlite3 是原生模块，安装脚本负责取预编译产物或就地编译（ADR-0016）。
  # 白名单越短越好这条没变——放行它是因为存储引擎选了 SQLite（ADR-0013），
  # 而 node:sqlite 在我们所用的 Electron/Node 版本上还是实验状态。
  better-sqlite3: true
  # electron 的安装脚本负责下载与本机 ABI 匹配的运行时（ADR-0016）
  electron: true
  # 显式拒绝：Windows 安装包的制作由 CI 上的 Windows runner 负责，
  # 本地开发不需要它跑安装脚本。写 false 而不是删掉，是为了让"看过并决定了"留痕。
  electron-winstaller: false
  # 原生模块，PTY 的唯一实现（docs/09 C7 / ADR-0031）。放行前已核实：v1.1.0 起纯 N-API
  # （唯一生产依赖 node-addon-api），安装脚本自带 prebuild、失败才退回 node-gyp——
  # 与 better-sqlite3 同一姿势。是否兼容本项目钉住的 Electron 43 由后面的烟雾测试验证。
  node-pty: true

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.66.0'
  - '@typescript-eslint/parser@8.66.0'
  - '@typescript-eslint/project-service@8.66.0'
  - '@typescript-eslint/scope-manager@8.66.0'
  - '@typescript-eslint/tsconfig-utils@8.66.0'
  - '@typescript-eslint/type-utils@8.66.0'
  - '@typescript-eslint/types@8.66.0'
  - '@typescript-eslint/typescript-estree@8.66.0'
  - '@typescript-eslint/utils@8.66.0'
  - '@typescript-eslint/visitor-keys@8.66.0'
  - typescript-eslint@8.66.0
  - electron@43.3.0

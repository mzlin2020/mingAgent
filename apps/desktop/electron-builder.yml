appId: com.xiaoming.desktop
productName: 小明

# 可执行文件名单独定，**不跟 productName 走**。
#
# 不定的后果是三平台各不相同：Windows 得到 `小明.exe`、macOS 得到 `小明.app`，
# 而 Linux 拿到的是 `@xmdesktop`——非 ASCII 的 productName 在 Linux 上不能直接当
# 可执行名，electron-builder 悄悄回退到了包名。于是"启动打包产物"这件事在
# CI 脚本里没有一个跨平台写法，而这正是 desktop job 之前绕开它、
# 改跑源码树的直接诱因（见 ADR-0016 补记二）。
#
# 用户看到的名字仍然是「小明」：窗口标题、Finder / 开始菜单里的应用名走 productName。
executableName: xiaoming

directories:
  output: release
  buildResources: build

# 只带产物与运行时依赖。源码、tsconfig、测试都不进包。
files:
  - dist/**/*
  - package.json

# ⚠️ **原生模块必须解包出 asar。**
# better-sqlite3 的 `.node` 走 `require()` 加载真实文件路径，而 asar 里的路径不是
# 真实路径——打进 asar 的表现是应用启动时"找不到 better_sqlite3.node"，
# 而开发模式下永远不会出现（那时没有 asar）。启动自检就是拦这一类的。
asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# 不让 electron-builder 内部再跑一次 @electron/rebuild。
# ADR-0016 已经实测清楚：better-sqlite3 13 随包发**全平台 N-API 预编译产物**
# （8 个 `prebuilds/*.node`），Node 与 Electron 共用同一份，本来就不需要重编。
# 而那一步在交叉打包时会直接失败——它会尝试为目标架构从源码 build，
# 于是 `node-gyp does not support cross-compiling native modules from source.`
#
# 换句话说：这一步在本机打包时是空转，在交叉打包时是纯阻塞。
# ⚠️ 引入**非 N-API** 的原生依赖那天，这行必须删掉并连同 ADR-0016 决策一一起重评。
npmRebuild: false

# M0-b 只验证"能产出安装包"。签名与公证是 M1+：
# 没有证书时强行开启会让本地构建直接失败，而那与本轮要验的东西无关。
mac:
  target: dir
  identity: null
win:
  target: dir
linux:
  target: dir
  category: Development

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ADR-0010：TS 7 与 TS 6 对同样的错误分别退出 1 和 2。
  # 所有步骤一律只判断"非零"，禁止判断具体退出码。
  FORCE_COLOR: '1'

jobs:
  # 类型检查与 lint 分开跑，让总耗时取 max 而不是 sum。
  # 实测（ADR-0010）：typecheck 8.6s，typed lint 26.4s / 峰值 1.4GB —— lint 是瓶颈。
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 断言双编译器工具链装配正确
        run: node scripts/assert-toolchain.mjs
      - name: 单文件规模纪律（docs/01 原则七，ADR-0032）
        run: node scripts/check-file-size.mjs
      - run: pnpm exec tsc -b
      - run: pnpm exec tsc -p tsconfig.tests.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ⚠️ 这个 job **不 build**，而 typed lint 要解析 @xm/* 的类型。
      # 少一条 paths 映射，类型就退回不存在的 dist/*.d.ts，报出来是一片
      # no-unsafe-*（看着像代码问题，其实是装配问题）。本地有 dist，永远复现不出来。
      - name: tsconfig paths 映射完整（没有构建产物时才暴露的那一类）
        run: node scripts/check-tsconfig-paths.mjs
      - run: pnpm exec eslint .

  # 三平台矩阵：内核与契约是纯逻辑，理应处处一致。
  # 这里一旦出现平台差异，说明有人在业务代码里做了平台判断（ADR-0007）。
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm exec vitest run

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 架构守护（内核零 I/O、契约零依赖、无循环依赖）
        run: pnpm exec depcruise packages apps --config .dependency-cruiser.cjs
      - name: 体积预算（契约包自身 < 15KB gzip）
        run: pnpm exec tsc -b && pnpm exec size-limit

  # 桌面产物。与 test 分开，因为它慢（要下 Electron 与打包工具链）且失败原因是另一类。
  #
  # ⚠️ 它验的是「能构建、能打包」，**不是**「能启动」。
  # 启动验证需要 GUI 依赖（libgtk / libatk / xvfb），本地开发容器里通常没有——
  # M0-b 就卡在这里，见 ADR-0016 的遗留。CI 的 runner 有这些库，所以启动自检
  # 放在这里跑：Linux 上用 xvfb-run，它是三平台里唯一需要额外准备的。
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - name: 类型检查主进程与渲染层（两套 lib / types，必须分开）
        run: |
          pnpm exec tsc -p apps/desktop/tsconfig.main.json
          pnpm exec tsc -p apps/desktop/tsconfig.renderer.json
      - name: 构建三段产物
        run: pnpm --filter @xm/desktop build
      - name: 打包（不签名、不公证，M0-b 只验证产物能出来）
        run: pnpm --filter @xm/desktop exec electron-builder --dir
      # ── 启动自检 ────────────────────────────────────────────────
      #
      # ⚠️ 跑的必须是**打包产物**，不能是 `electron .`。
      #
      # 这一步之前写的是 `pnpm --filter @xm/desktop exec electron .`，而
      # apps/desktop/package.json 的 main 指向 `./dist/main/index.js`——那是源码树，
      # **根本没有 asar**。于是这个 job 唯一无法覆盖的，恰好就是它声称要覆盖的那一类：
      # `.node` 被打进 asar、`files` 漏了 `prebuilds/`。
      #
      # main/index.ts 的注释与 ADR-0016 当时都写着"这里跑的是 asar 里的产物"。
      # 两处都写了，CI 里没有一处是那么做的——本项目第九次「规则存在 ≠ 规则生效」。
      #
      # 先断言产物存在再跑：路径拼错时要当场报"文件不在"，
      # 而不是回退到某个碰巧能跑起来的东西上，那等于把这一格又打了个假勾。
      - name: 定位打包产物
        shell: bash
        run: |
          # macOS 的 .app 目录名跟着 executableName 走（`xiaoming.app`），
          # **不是** productName —— 只有 Contents/Frameworks 下的 Helper 仍叫「小明 Helper」。
          # 所以这里用 `*.app` 通配，不写死名字：Helper 都在 Frameworks/ 下，不会误匹配。
          case "${{ matrix.os }}" in
            ubuntu-latest)  BIN="apps/desktop/release/linux-unpacked/xiaoming" ;;
            windows-latest) BIN="apps/desktop/release/win-unpacked/xiaoming.exe" ;;
            macos-latest)   BIN=$(echo apps/desktop/release/mac*/*.app/Contents/MacOS/xiaoming) ;;
          esac
          if [ ! -f "$BIN" ]; then
            echo "❌ 打包产物不存在：$BIN"
            # `ls -R | head` 在 `-o pipefail` 下会因 SIGPIPE 报 "ls: stdout: Undefined error: 0"，
            # 让诊断信息本身变成第二个错误。用 find + || true 避开。
            find apps/desktop/release -maxdepth 5 -print 2>/dev/null | head -60 || true
            exit 1
          fi
          echo "XM_APP_BIN=$BIN" >> "$GITHUB_ENV"
          echo "✓ 打包产物：$BIN"

      # Electron 的 chrome-sandbox 必须 root:root + 4755，否则它宁可 abort 也不肯
      # 裸奔运行（日志：The SUID sandbox helper binary was found, but is not configured correctly）。
      #
      # ⚠️ **刻意不用 `--no-sandbox` 绕过去。** 那是最省事的一行，也正是 ADR-0015
      # 点名的那种"为了方便关掉隔离"——而这个 job 要验的恰恰是产物在真实隔离下能不能起来。
      # 用 --no-sandbox 换来的绿，证明不了任何用户会遇到的场景。
      - name: Linux · 让 Electron 的 SUID sandbox 可用
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo chown root:root apps/desktop/release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 apps/desktop/release/linux-unpacked/chrome-sandbox
          # Ubuntu 24.04 起默认限制非特权用户命名空间，Chromium 的 sandbox 会因此起不来。
          # 失败不致命（旧镜像上没这个 key），所以 || true。
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # 未签名的 arm64 产物在 Apple Silicon 上不给运行，而 electron-builder 改写过
      # 二进制、Electron 自带的签名已经失效。identity: null 是 M0-b 刻意的（无证书），
      # 所以这里补一个 ad-hoc 签名——与用户在自己 Mac 上要做的是同一件事。
      - name: macOS ad-hoc 签名
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          codesign --force --deep --sign - apps/desktop/release/mac*/*.app

      # 一律用块标量 `run: |`。写成 `run: "$XM_APP_BIN" --smoke` 会让 YAML
      # 把开头的引号解析成引用标量，后面的 ` --smoke` 变成非法尾巴——整个
      # workflow 文件解析失败，所有 job 一个都不跑。踩过一次（run #2）。
      - name: 启动自检 —— 跑打包产物（Linux 需要 xvfb）
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          xvfb-run --auto-servernum "$XM_APP_BIN" --smoke
        env:
          XM_SMOKE: '1'

      - name: 启动自检 —— 跑打包产物
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          "$XM_APP_BIN" --smoke
        env:
          XM_SMOKE: '1'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # `scripts/check-secrets.mjs` 零依赖（只用 node: 内置模块），这个 job **不装依赖**。
      #
      # 而 `actions/setup-node@v5` 的 `package-manager-cache` 默认是 true：它读
      # package.json 的 `packageManager` 字段就自动开缓存。于是这个 job 两次翻车——
      #
      #   一、pre 步骤找不到 pnpm：Unable to locate executable file: pnpm（run #2 前后）
      #   二、post 步骤存不了缓存：Path Validation Error: Path(s) ... do(es) not exist（run #9）
      #
      # 第一次的修法是给它装上 pnpm。那治的是症状：**一个从不 install 的 job，
      # 根本不该进缓存这条路。** 病因没动，于是它换了个步骤又回来了，
      # 而且这次是在 "Post job cleanup" 里——离真正的原因更远，更难认。
      #
      # 现在直接关掉自动缓存，pnpm 也就不必装了（它当初只是为了喂饱缓存那一步）。
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      # 本地 pre-commit 钩子可以被 --no-verify 绕过，CI 这一道不行。
      # 扫描 PR 的全部改动，而不只是最后一次提交。
      - name: 密钥扫描
        run: |
          git reset --soft ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }} || git reset --soft HEAD
          node scripts/check-secrets.mjs
